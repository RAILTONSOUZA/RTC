server.port=8080
spring.application.name=app-reforma-fiscal

# Multipart (Upload de arquivos grandes e lotes de XMLs)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Pasta padrão do projeto para varredura
app.default-scan-dir=c:/agente/agente

# Banco de Dados Local (H2 em arquivo local permanente)
spring.datasource.url=jdbc:h2:file:./data/reforma_fiscal;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
